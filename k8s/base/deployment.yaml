apiVersion: apps/v1
kind: Deployment
metadata:
  name: enterprise-app
  namespace: enterprise-app
spec:
  replicas: 2
  selector:
    matchLabels: { app: enterprise-app }
  template:
    metadata:
      labels: { app: enterprise-app }
    spec:
      containers:
      - name: enterprise-app
        image: IMAGE_PLACEHOLDER
        ports: [{ containerPort: 8080 }]
        env:
        - name: APP_VERSION
          value: IMAGE_TAG_PLACEHOLDER
        - name: ASPNETCORE_ENVIRONMENT
          value: Production
        readinessProbe: { httpGet: { path: /healthz, port: 8080 }, initialDelaySeconds: 5, periodSeconds: 10 }
        livenessProbe: { httpGet: { path: /health, port: 8080 }, initialDelaySeconds: 10, periodSeconds: 20 }
        resources:
          requests: { cpu: 100m, memory: 128Mi }
          limits: { cpu: 500m, memory: 512Mi }
