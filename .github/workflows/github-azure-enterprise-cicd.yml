name: Enterprise CI Pipeline

on:
  push:
    branches:
      - develop
      - main

  pull_request:
    branches:
      - develop
      - main

jobs:

  build-test:
    name: Build and Test
    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Check Files
        run: |
          echo "Repository files:"
          ls -la
          echo "Solution files:"
          find . -name "*.sln"

      - name: Restore
        run: dotnet restore EnterpriseApp.sln

      - name: Build
        run: dotnet build EnterpriseApp.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test EnterpriseApp.sln --configuration Release --no-build

      - name: Docker Build
        run: |
          docker build -t enterprise-app:${{ github.sha }} .

      - name: Verify
        run: |
          docker images
          echo "CI PIPELINE SUCCESS"
