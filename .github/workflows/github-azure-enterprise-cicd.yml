name: .NET CI Pipeline

on:
  push:
    branches:
      - develop
      - main

  pull_request:
    branches:
      - develop
      - main

jobs:

  build-test:
    name: Build and Test
    runs-on: ubuntu-latest

    steps:

      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore Dependencies
        run: dotnet restore EnterpriseApp.sln

      - name: Build Application
        run: dotnet build EnterpriseApp.sln --configuration Release --no-restore

      - name: Run Unit Tests
        run: dotnet test EnterpriseApp.sln --configuration Release --no-build

      - name: Build Docker Image
        run: docker build -t enterprise-app:${{ github.sha }} .

      - name: Verify Docker Image
        run: docker images
